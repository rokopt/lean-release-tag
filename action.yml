name: 'Lean release tagging'
description: 'Creates a Git tag whenever your project updates to a new Lean release.'
inputs:
  GITHUB_TOKEN:
    description: 'Token used to push tags and to access the GitHub API. When in doubt, set this to the value of secrets.GITHUB_TOKEN.'
    required: true
  before:
    description: 'Commit hash of the most recent commit before the push. Unless you know what you are doing, you do not need to change this.'
    required: false
    default: ${{ github.event.before }}
  after:
    description: 'Commit hash of the most recent commit after the push. Unless you know what you are doing, you do not need to change this.'
    required: false
    default: ${{ github.event.after }}
  toolchain-path:
    description: 'Path of the `lean-toolchain` file, relative to the root of the repository. Default value: `lean-toolchain`.'
    required: false
    default: lean-toolchain
  do-release:
    description: 'Whether to create a GitHub release for the new tag. Allowed values: `true` and `false`. Default value: `false`.'
    required: false
    default: false
runs:
  using: "composite"
  steps:
    # Composite actions do not enforce `required: true`, so check the token explicitly: otherwise,
    # the failure is a confusing error message about the `token` input of `actions/checkout`.
    - name: Check inputs
      run: |
        if [[ -z "$GH_TOKEN" ]]; then
          echo "::error::The GITHUB_TOKEN input is empty. If you set it to a secret, check that the secret exists and that its name is spelled correctly."
          exit 1
        fi
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.GITHUB_TOKEN }}

    - name: Checkout the repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        # We set infinite fetch depth, for now, because we can't tell how many revisions are between
        # `before` and `after` before actually accessing the repo.
        fetch-depth: 0
        # Use the given token, rather than the default `github.token`, to push the tags.
        token: ${{ inputs.GITHUB_TOKEN }}

    - name: Run the script
      run: ${{ github.action_path }}/create-tags.sh
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        BEFORE: ${{ inputs.before }}
        AFTER: ${{ inputs.after }}
        TOOLCHAIN_PATH: ${{ inputs.toolchain-path }}
        DO_RELEASE: ${{ inputs.do-release }}
